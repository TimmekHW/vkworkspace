# Test dialect: vkteams-25.4 as it was before the live check of 2026-10-30 —
# only bold, inline code, code blocks and mentions (and quotes in HTML) render.
name = "untested"
extends = "vkteams-25.4"

[support]
italic         = { markdownv2 = "untested", html = "untested" }
underline      = { markdownv2 = "untested", html = "untested" }
strikethrough  = { markdownv2 = "untested", html = "untested" }
link           = { markdownv2 = "untested", html = "untested" }
quote          = { markdownv2 = "untested" }
ordered_list   = { markdownv2 = "untested", html = "untested" }
unordered_list = { markdownv2 = "untested", html = "untested" }
