name: Release

on:
  push:
    tags:
      - "v*"

permissions: {}

jobs:
  build:
    name: Build and check the distributions
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Install uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
        with:
          enable-cache: false
      - name: The tag must match the package version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version=$(sed -n 's/^__version__ = "\(.*\)"/\1/p' vkworkspace/__meta__.py)
          test "v$version" = "$TAG" || { echo "tag $TAG, package version $version"; exit 1; }
      - name: Build
        run: uv build --no-sources
      - name: Check the metadata
        run: uvx twine check --strict dist/*
      # Run outside the checkout: there `import vkworkspace` would find the sources.
      - name: Smoke test (wheel)
        working-directory: ${{ runner.temp }}
        run: uv run --isolated --no-project --with "$GITHUB_WORKSPACE"/dist/*.whl python "$GITHUB_WORKSPACE/scripts/smoke_installed.py"
      - name: Smoke test (source distribution)
        working-directory: ${{ runner.temp }}
        run: uv run --isolated --no-project --with "$GITHUB_WORKSPACE"/dist/*.tar.gz python "$GITHUB_WORKSPACE/scripts/smoke_installed.py"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  pypi-publish:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: dist
          path: dist/
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # release/v1

  github-release:
    name: Create the GitHub Release
    needs: pypi-publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: dist
          path: dist/
      - name: Create GitHub Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          generate_release_notes: true
          files: dist/*
