name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14", "3.15"]

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Install uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
        with:
          enable-cache: false
      - name: Install the project and the test dependencies
        run: uv sync --python ${{ matrix.python-version }} --no-default-groups --group test
      - name: Run tests
        run: uv run --no-sync pytest --cov=vkworkspace --cov-report=term-missing

  lowest:
    name: lowest declared dependency versions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Install uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
        with:
          enable-cache: false
      - name: Install the project with the lowest versions pyproject.toml allows
        run: uv sync --python 3.11 --resolution lowest-direct --no-default-groups --group test
      - name: Run tests
        run: uv run --no-sync pytest

  free-threaded:
    name: Python 3.15 without the GIL
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Install uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
        with:
          enable-cache: false
      - name: Install the project and the test dependencies
        run: uv sync --python 3.15t --no-default-groups --group test
      - name: Run tests
        run: uv run --no-sync pytest
